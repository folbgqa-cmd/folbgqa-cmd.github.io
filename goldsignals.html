<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحكم عن بُعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--ink:#1b2733;--mute:#63727f;--card:#fff;--line:#d3dae1;--acc:#2f5bea;--bad:#d6453d;--ok:#1f9d63}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141b22;--ink:#e6ebf0;--mute:#8d9ba7;--card:#1d262f;--line:#2e3a45;--acc:#6f93ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Tajawal,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font-size:22px;font-weight:800;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
button{font:700 15px Tajawal,sans-serif;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.primary{background:var(--acc);border-color:var(--acc);color:#fff;width:100%;margin-top:12px}
#pad{height:260px;border-radius:18px;border:2px solid var(--acc);touch-action:none;user-select:none;display:grid;place-items:center;color:var(--mute);
background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:18px 18px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.row.two{grid-template-columns:1fr auto}.row.four{grid-template-columns:repeat(4,1fr)}
.hide{display:none}.note{font-size:13px;color:var(--mute);margin:8px 0 0}
</style>
</head>
<body>
<h1>تحكم عن بُعد <span class="dot" id="dot"></span></h1>

<section class="box" id="login">
  <label for="url">رابط النفق (يبدأ بـ wss://)</label>
  <input id="url" placeholder="wss://xxxx.trycloudflare.com" autocomplete="off">
  <label for="pin">رمز الدخول</label>
  <input id="pin" inputmode="numeric" autocomplete="off">
  <button class="primary" id="connect">اتصال</button>
  <p class="note" id="msg"></p>
</section>

<main class="hide" id="ctl">
  <div id="pad">حرّك إصبعك هنا</div>
  <div class="row">
    <button data-c="left">نقرة يسار</button>
    <button data-c="double">نقرة مزدوجة</button>
    <button data-c="right">نقرة يمين</button>
  </div>
  <div class="row"><button id="up">تمرير لأعلى</button><button id="down">تمرير لأسفل</button><button id="drop">قطع الاتصال</button></div>

  <section class="box" style="margin-top:12px">
    <div class="row two"><input id="txt" placeholder="اكتب نصًا للإرسال"><button id="send">إرسال</button></div>
    <div class="row four">
      <button data-k="enter">Enter</button><button data-k="backspace">حذف</button>
      <button data-k="esc">Esc</button><button data-k="alt+tab">تبديل نافذة</button>
    </div>
    <div class="row two"><input id="link" placeholder="https://"><button id="open">فتح رابط</button></div>
  </section>

  <section class="box">
    <div class="row four">
      <button data-t="chrome">متصفح</button><button data-t="notepad">محرر</button>
      <button data-t="lock">قفل</button><button data-t="sleep">سكون</button>
    </div>
  </section>
</main>

<script>
let ws, $ = id => document.getElementById(id);
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const store = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} };
try { $('url').value = localStorage.getItem('url') || '' } catch (e) {}

$('connect').onclick = () => {
  const url = $('url').value.trim();
  if (!url.startsWith('wss://')) { $('msg').textContent = 'الرابط يجب أن يبدأ بـ wss://'; return }
  $('msg').textContent = 'جارٍ الاتصال…';
  ws = new WebSocket(url);
  ws.onopen = () => send({ type: 'auth', pin: $('pin').value.trim() });
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type !== 'auth') return;
    if (m.ok) { store('url', url); $('login').classList.add('hide'); $('ctl').classList.remove('hide'); $('dot').classList.add('on') }
    else $('msg').textContent = 'رمز الدخول خاطئ';
  };
  ws.onerror = () => $('msg').textContent = 'تعذّر الاتصال. تأكد من الرابط وتشغيل البرنامج والنفق.';
  ws.onclose = () => { $('dot').classList.remove('on'); $('ctl').classList.add('hide'); $('login').classList.remove('hide') };
};
$('drop').onclick = () => ws && ws.close();

const pad = $('pad'); let last = null, moved = 0, t0 = 0, sens = 1.6, acc = 0;
pad.addEventListener('pointerdown', e => { pad.setPointerCapture(e.pointerId); last = e; moved = 0; t0 = Date.now() });
pad.addEventListener('pointermove', e => {
  if (!last) return;
  const dx = (e.clientX - last.clientX) * sens, dy = (e.clientY - last.clientY) * sens;
  moved += Math.abs(dx) + Math.abs(dy); last = e;
  const now = performance.now(); if (now - acc < 16) return; acc = now;
  send({ type: 'move', dx: Math.round(dx), dy: Math.round(dy) });
});
pad.addEventListener('pointerup', () => { if (moved < 6 && Date.now() - t0 < 250) send({ type: 'click' }); last = null });

document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
  const c = b.dataset.c; send({ type: 'click', button: c === 'right' ? 'right' : 'left', clicks: c === 'double' ? 2 : 1 });
});
document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => send({ type: 'key', key: b.dataset.k }));
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => send({ type: 'task', name: b.dataset.t }));
$('up').onclick = () => send({ type: 'scroll', amount: 400 });
$('down').onclick = () => send({ type: 'scroll', amount: -400 });
$('send').onclick = () => { send({ type: 'type', text: $('txt').value }); $('txt').value = '' };
$('open').onclick = () => { send({ type: 'url', url: $('link').value.trim() }); $('link').value = '' };
</script>
</body>
</html>
