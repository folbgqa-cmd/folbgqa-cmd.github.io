name: Build remote agent
on:
  push:
    paths:
      - "pc-agent/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller websockets pyautogui
      - run: pyinstaller --onefile --name remote-agent pc-agent/agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: remote-agent
          path: dist/remote-agent.exe
